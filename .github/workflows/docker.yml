# TODO: Build your image and push it to Docker Hub automatically on every merge to master.
# Use the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN — do NOT hard-code them.
name: Build and Push to Docker Hub

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract application version
        id: version
        run: |
          VERSION=$(grep '^VERSION =' apps/python/app.py | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT


      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            jaydenhnguyen/clo835-assignment2:${{ steps.version.outputs.version }}
            jaydenhnguyen/clo835-assignment2:${{ github.sha }}
        
