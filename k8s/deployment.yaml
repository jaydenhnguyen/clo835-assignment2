# TODO: a Deployment that runs 3 replicas of YOUR image; the container serves on port 8080.
# Docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clo835-assignment2-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clo835-assignment2-app
  template:
    metadata:
      labels:
        app: clo835-assignment2-app
    spec:
      containers:
        - name: clo835-assignment2-app
          image: jaydenhnguyen/clo835-assignment2:0.2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"